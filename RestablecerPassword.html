<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restablecer contraseña · Torneo de Ping Pong FI</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/supabase-pages.css">
</head>
<body>
<nav class="top" aria-label="Principal">
  <div class="wrap nav-in">
    <a class="brand" href="Pagina Torneo.html"><img class="logo-main" src="assets/logo-pingpong.png" alt="Torneo de Ping Pong FI" /></a>
  </div>
</nav>

<main class="wrap">
  <div class="hud center" id="resetView">
    <h1>Restablecer <span style="color:var(--red2)">contraseña</span></h1>
    <p class="sub" id="resetSub">Abre esta página desde el enlace del correo de recuperación. Si llegaste desde ese enlace, define tu nueva contraseña abajo.</p>
    <form id="resetForm" novalidate>
      <div class="field" id="fP1">
        <label for="p1">Nueva contraseña</label>
        <input type="password" id="p1" autocomplete="new-password" required minlength="8" aria-describedby="fP1Err" />
        <span class="ferr" id="fP1Err" aria-live="polite">Mínimo 8 caracteres.</span>
      </div>
      <div class="field" id="fP2">
        <label for="p2">Repite la contraseña</label>
        <input type="password" id="p2" autocomplete="new-password" required aria-describedby="fP2Err" />
        <span class="ferr" id="fP2Err" aria-live="polite">Las contraseñas no coinciden.</span>
      </div>
      <button class="btn btn-main" id="btnReset" type="submit" style="width:100%;justify-content:center">Guardar contraseña</button>
      <p class="msg" id="resetMsg" aria-live="assertive"></p>
    </form>
  </div>
</main>

<script src="supabase/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="supabase/logger.js"></script>
<script src="supabase/client.js"></script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const msg = $('#resetMsg');

  if (!window.SB_READY){
    msg.textContent = 'Sitio no conectado al servidor.';
    msg.className = 'msg err';
    return;
  }
  // supabase-js procesa el enlace de recuperación automáticamente y emite
  // el evento PASSWORD_RECOVERY con una sesión temporal.
  let recovered = false;
  window.SB.auth.onAuthStateChange((evt) => {
    if (evt === 'PASSWORD_RECOVERY'){
      recovered = true;
      $('#resetSub').textContent = 'Enlace válido. Define tu nueva contraseña.';
    }
  });
  window.SB.auth.getSession().then(({ data }) => { if (data.session) recovered = true; });

  $('#resetForm').addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = $('#p1').value, p2 = $('#p2').value;
    $('#fP1').classList.toggle('invalid', p1.length < 8);
    $('#fP2').classList.toggle('invalid', p1 !== p2);
    if (p1.length < 8){ $('#p1').focus(); return; }
    if (p1 !== p2){ $('#p2').focus(); return; }
    if (!recovered){
      msg.textContent = 'No hay una sesión de recuperación activa. Abre el enlace del correo de nuevo.';
      msg.className = 'msg err';
      return;
    }
    const btn = $('#btnReset');
    btn.disabled = true; btn.textContent = 'Guardando…';
    try {
      const { error } = await window.SB.auth.updateUser({ password: p1 });
      if (error) throw error;
      msg.textContent = 'Contraseña actualizada. Ya puedes iniciar sesión en el panel.';
      msg.className = 'msg ok';
      setTimeout(() => { location.href = 'Admin.html'; }, 1800);
    } catch(err){
      window.SB_LOG && window.SB_LOG.error('AUTH-004', err);
      msg.textContent = 'No se pudo actualizar la contraseña. Solicita un nuevo enlace. (código AUTH-004)';
      msg.className = 'msg err';
    } finally {
      btn.disabled = false; btn.textContent = 'Guardar contraseña';
    }
  });
})();
</script>
</body>
</html>
