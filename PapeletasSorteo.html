<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Papeletas del sorteo · Torneo de Ping Pong FI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--line:#d8d3c8;--muted:#6b6155;--ink:#1c1813}
  *{box-sizing:border-box;margin:0}
  body{font-family:Inter,system-ui,sans-serif;background:#efece5;color:var(--ink)}
  .bar{position:sticky;top:0;z-index:10;background:#171512;color:#efece5;padding:12px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:end}
  .bar h1{font-family:'Saira Condensed',sans-serif;font-size:18px;letter-spacing:.05em;text-transform:uppercase;margin-right:auto}
  .fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#b8b0a2}
  .fld select,.fld input{background:#26221d;border:1px solid #443e35;border-radius:6px;color:#efece5;padding:6px 8px;font-size:13px;min-height:34px}
  .fld input[type="number"]{width:70px}
  .fld label.ck{display:flex;align-items:center;gap:6px;min-height:34px;font-size:12px;color:#efece5;cursor:pointer}
  .btn{background:#c8a24a;border:none;border-radius:7px;color:#171512;font-weight:700;font-size:13px;padding:9px 16px;cursor:pointer;min-height:38px}
  .btn.ghost{background:transparent;border:1px solid #443e35;color:#efece5}
  main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
  .doc-title{font-family:'Saira Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:26px 0 4px}
  .doc-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:12px}
  .grid{display:grid;gap:0}
  .ballot{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 8px;background:#fff;break-inside:avoid;page-break-inside:avoid}
  .grid.cut .ballot{border:1.5px dashed #999}
  .ballot .cat{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
  .ballot .main{font-family:'Saira Condensed',sans-serif;font-weight:800;line-height:1.05;word-break:break-word}
  .ballot .sub{font-size:11px;color:var(--muted);margin-top:2px}
  .ballot .code{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:5px;letter-spacing:.5px}
  table.sheet{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
  .sheet th,.sheet td{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top}
  .sheet th{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;background:#f3efe6}
  .sheet .c{text-align:center}
  .warn{border:1.5px solid #b0821f;background:#faf3df;color:#6d5313;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px}
  .totals{font-family:'JetBrains Mono',monospace;font-size:12px;margin:10px 0}
  .sign{margin-top:40px;display:flex;gap:60px}
  .sign div{flex:1;border-top:1.5px solid var(--ink);padding-top:6px;font-size:12px;text-align:center}
  .state{padding:80px 20px;text-align:center;color:var(--muted)}
  a{color:#8a6c1d}a:hover{color:#6d5313}
  @media print{
    .bar,.no-print{display:none !important}
    body{background:#fff}
    main{max-width:none;padding:0}
    .warn{display:none}
    @page{margin:12mm}
  }
  body.paper-a4.landscape,body.paper-letter.landscape{/* orientación vía @page */}
</style>
</head>
<body>
<div class="bar">
  <h1>Papeletas del sorteo físico</h1>
  <label class="fld">Papel
    <select id="pPaper"><option value="letter">Carta</option><option value="a4">A4</option></select>
  </label>
  <label class="fld">Orientación
    <select id="pOrient"><option value="portrait">Vertical</option><option value="landscape">Horizontal</option></select>
  </label>
  <label class="fld">Tamaño de papeleta
    <select id="pSize"><option value="small">Pequeño</option><option value="medium" selected>Mediano</option><option value="custom">Personalizado</option></select>
  </label>
  <label class="fld" id="pCustomWrap" style="display:none">Alto (mm)
    <input id="pCustomH" type="number" min="15" max="120" value="40" />
  </label>
  <label class="fld">Columnas
    <input id="pCols" type="number" min="1" max="6" value="3" />
  </label>
  <label class="fld">Fuente
    <input id="pFont" type="number" min="10" max="48" value="22" />
  </label>
  <label class="fld">Copias
    <input id="pCopies" type="number" min="1" max="10" value="1" />
  </label>
  <div class="fld">
    <label class="ck"><input type="checkbox" id="pCut" checked /> Líneas de corte</label>
    <label class="ck"><input type="checkbox" id="pCode" checked /> Código de control</label>
  </div>
  <div class="fld">
    <label class="ck"><input type="checkbox" id="pUpper" checked /> Mayúsculas</label>
    <label class="ck"><input type="checkbox" id="pHead" checked /> Encabezado de categoría</label>
  </div>
  <button class="btn" id="pPrint" type="button">Imprimir / Guardar PDF</button>
</div>
<main id="pMain"><div class="state">Cargando documento…</div></main>
<script src="papeletas.js"></script>
</body>
</html>
