<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Previsualización · piel leaderboard del bracket</title>
<link rel="stylesheet" href="css/bracket-final.css">
<link rel="stylesheet" href="css/bracket-canvas.css?v=200">
<link rel="stylesheet" href="css/bracket-fortnite.css">
<style>
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);margin:0;padding:18px 20px 60px;background-image:radial-gradient(130% 70% at 50% -8%,var(--page-tint) 0%,var(--bg) 52%)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
button{padding:7px 13px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:inherit;font-size:12px;cursor:pointer}
button.on{background:var(--red-soft);border-color:var(--red2);color:var(--red2)}
.bkt{padding:22px 20px 10px;overflow-x:auto}
h3{font-family:var(--disp);font-style:italic;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
</style>
</head>
<body data-cat="principiante">
<p style="font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin:0 0 12px">Banco de pruebas · nombres y marcadores de ejemplo para revisar la piel visual. No toca datos reales.</p>
<div class="row" id="picker"></div>
<h3 id="ttl"></h3>
<div id="bracket"><div class="hud"><div class="bkt" id="bracket-cols"></div><div class="gloria">« ¡La gloria te espera! »</div></div></div>
<script src="supabase/format-engine.js"></script>
<script src="supabase/bracket-topology.js"></script>
<script src="supabase/bracket-canvas.js"></script>
<script src="supabase/bracket-config.js"></script>
<script src="torneo-bracket-render.js"></script>
<script src="torneo-bracket-canvas.js"></script>
<script>
const CFG = window.SB_BRACKETCFG, TOPO = window.FI_BKT_TOPO;
const LBL = { principiante:'PRINCIPIANTE', intermedio:'INTERMEDIO', avanzado:'AVANZADO / OPEN' };
let CAT = 'principiante', G = 5, FREE = false;

function P(name, src){
  return { mode:'REGISTRATION', registrationId:1, playerId:1, publicCode:null, displayName:name,
    sourceLabel:src, groupId:null, groupLabel:null, facultyLogo:null, careerLogo:null };
}
const NAMES = {
  principiante:['Damián Control','Ana Principiante','Beto Paleta','Eva Pelota','Camila Saque','Fabián Revés','Gina de Prueba','Iván Drive'],
  intermedio:['Alex Test','Bruno Intermedio','Carla de Prueba','Elena Revés','Diego Control','Héctor Efecto','Fernando Topspin','Nadia Corta'],
  avanzado:['Axel Relámpago','Brenda Corta','Falco Avanza','Bárbaro de Revés','Daniela Smash','César Efecto','Fernando Revés','Iván Drive']
};

function fill(cfg, cat){
  const n = NAMES[cat], s = cfg.slots;
  const set = (id, a, sa, b, sb, scoreA, scoreB, win) => {
    const sl = s[id]; if (!sl) return;
    if (a) sl.participantA = P(a, sa); else sl.participantA.sourceLabel = sa || null;
    if (b) sl.participantB = P(b, sb); else sl.participantB.sourceLabel = sb || null;
    sl.manualScoreA = scoreA; sl.manualScoreB = scoreB; sl.manualWinnerSlot = win || null;
    sl.manualStatus = win ? 'CONFIRMED' : 'PROVISIONAL';
  };
  // Cuartos: terminados, en espera y por definir
  set('quarterLeftTop',    n[0], '2º GRUPO A', n[1], '2º GRUPO B', 2, 0, 'A');
  set('quarterLeftBottom', n[2], '2º GRUPO A', null, '2º GRUPO B', 2, null, null);
  set('quarterRightTop',   n[5], '2º GRUPO A', null, '2º GRUPO B', null, null, null);
  set('quarterRightBottom',n[6], '2º GRUPO A', n[7], '2º GRUPO B', 2, 1, 'A');
  // Semifinales
  set('semifinalLeft',  n[0], 'GANADOR DE CUARTOS SUP.', n[2], 'GANADOR DE CUARTOS INF.', 2, 0, 'A');
  set('semifinalRight', n[5], 'GANADOR DE CUARTOS SUP.', null, 'GANADOR DE CUARTOS INF.', 2, null, null);
  // Final
  set('final', n[0], 'GANADOR SEMIFINAL IZQ.', n[3], 'GANADOR SEMIFINAL DER.', 3, 1, 'A');
}

function draw(){
  document.body.setAttribute('data-cat', CAT);
  const cfg = CFG.emptyConfig({ categoryLabel: LBL[CAT] });
  const rec = CFG.recommendFormat(G);
  if (rec) CFG.applySystem(cfg, rec);
  fill(cfg, CAT);
  const plan = TOPO.buildPlan(cfg.format);
  if (FREE) window.FI_BKT_CANVAS.layoutFromPlan(cfg, plan);
  document.getElementById('ttl').textContent =
    G + ' grupos · ' + plan.systemLabel + ' · ' + plan.columns.length + ' columnas' + (FREE ? ' · lienzo libre' : '');
  TORNEO_BKT.render(document.getElementById('bracket-cols'), cfg, { catLabel: LBL[CAT], source:'published' });
  document.querySelectorAll('#picker button').forEach(b =>
    b.classList.toggle('on', b.dataset.cat === CAT || +b.dataset.g === G));
}
document.getElementById('picker').innerHTML =
  ['principiante','intermedio','avanzado'].map(c => `<button data-cat="${c}">${c}</button>`).join('') +
  '<span style="width:16px"></span>' +
  [4,5,6,8].map(g => `<button data-g="${g}">${g} grupos</button>`).join('') +
  '<span style="width:16px"></span><button data-free="1">lienzo libre</button>';
document.querySelectorAll('#picker button').forEach(b => b.onclick = () => {
  if (b.dataset.free) FREE = !FREE;
  else if (b.dataset.cat) CAT = b.dataset.cat; else G = +b.dataset.g; draw();
});
draw();
window.addEventListener('resize', () => TORNEO_BKT.drawConnectors(document.getElementById('bracket')));
</script>
</body>
</html>
