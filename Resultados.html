<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resultados · Torneo de Ping Pong FI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/supabase-pages.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="manifest" href="manifest.webmanifest">
<style>
  .matches{display:flex;flex-direction:column;gap:10px;margin:22px 0 60px}
  .match{display:grid;grid-template-columns:64px 1fr auto 1fr auto;gap:12px;align-items:center;padding:13px 16px}
  .match .mg{font-family:var(--disp);font-weight:800;font-style:italic;font-size:16px;color:var(--red2);text-align:center}
  .match .mg small{display:block;font-family:var(--mono);font-style:normal;font-weight:400;font-size:8.5px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin-top:2px}
  .match .mp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
  .match .mp.pa{text-align:right}
  .match .mp.win{color:var(--green);font-weight:600}
  .match .mp.tbd{color:var(--dim);font-style:italic}
  .match .vs{font-family:var(--mono);font-size:13px;color:var(--text);letter-spacing:0.5px;font-weight:700;text-align:center}
  .match .vs small{display:block;font-family:var(--mono);font-weight:400;font-size:9px;color:var(--dim);letter-spacing:0.3px;margin-top:2px;text-transform:none}
  @media (max-width:640px){
    .match{grid-template-columns:48px 1fr auto;grid-template-areas:"g a badge" "g b badge"}
    .match .mg{grid-area:g}
    .match .mp.pa{grid-area:a;text-align:left}
    .match .mp.pb{grid-area:b}
    .match .vs{display:none}
    .match .badge{grid-area:badge;align-self:center}
  }
</style>
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido</a>

<nav class="top" data-site-nav data-active="resultados" aria-label="Principal"></nav>

<main class="wrap" id="contenido">
  <div class="head">
    <div>
      <h1>Resultados de la <span class="r">fase de grupos</span></h1>
      <p>Partidos publicados por la organización. Los resultados de la fase eliminatoria aparecerán en el <a href="Bracket.html" style="color:var(--gold)">bracket</a> cuando inicie.</p>
    </div>
    <div class="count"><b id="resCount">—</b><small>Partidos</small></div>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input type="text" id="resSearch" placeholder="Buscar jugador o grupo…" autocomplete="off" aria-label="Buscar jugador o grupo" />
    </div>
    <select class="filter" id="resCat" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option></select>
    <select class="filter" id="resGroup" aria-label="Filtrar por grupo"><option value="">Todos los grupos</option></select>
    <select class="filter" id="resStatus" aria-label="Filtrar por estado">
      <option value="">Todo estado</option>
      <option value="SCHEDULED">Programados</option>
      <option value="PLAYED">Jugados</option>
      <option value="WALKOVER">Walkover</option>
      <option value="CANCELLED">Cancelados</option>
      <option value="VOID">Anulados</option>
      <option value="DISPUTED">En revisión</option>
    </select>
    <button class="btn btn-ghost" id="resClear" type="button">Limpiar</button>
  </div>

  <div class="toolhead" style="display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap">
    <span class="metaline" id="resMeta" style="flex:1" aria-live="polite"></span>
    <button class="btn btn-ghost" id="resReload" type="button">Actualizar</button>
  </div>

  <div class="state" id="resState" aria-live="polite"><span class="spin" aria-hidden="true">◌</span> Cargando partidos…</div>
  <div class="matches" id="resList" aria-busy="true"></div>
</main>

<script src="supabase/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="supabase/logger.js"></script>
<script src="supabase/validation.js"></script>
<script src="supabase/client.js"></script>
<script src="supabase/catalog.js"></script>
<script src="supabase/groups.js"></script>
<script src="supabase/logo-resolver.js"></script>
<script src="supabase/public-links.js"></script>
<script src="supabase/results.js"></script>
<script src="supabase/ui.js"></script>
<script src="supabase/nav.js"></script>
<script src="supabase/debug-panel.js"></script>
<script>
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const V = window.SB_VALIDATE, UI = window.SB_UI;
  const state = { rows: [], catNames: {}, regByNick: {}, q: '', cat: '', grp: '', status: '', loadedAt: null };
  function regFor(groupId, nickname){
    return state.regByNick[groupId + '|' + V.normText(nickname)] || null;
  }

  function el(tag, cls, text){
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function showState(title, sub, retry){
    const st = $('#resState');
    st.style.display = 'block';
    st.textContent = '';
    if (title) st.appendChild(el('b', null, title));
    if (sub) st.appendChild(document.createTextNode(sub));
    if (retry){
      const b = el('button', 'btn btn-ghost', 'Reintentar');
      b.type = 'button'; b.style.marginTop = '16px'; b.onclick = load;
      st.appendChild(document.createElement('br')); st.appendChild(b);
    }
  }
  function skeletons(){
    const wrap = $('#resList');
    wrap.textContent = '';
    for (let i = 0; i < 6; i++){ const s = el('div', 'skel'); s.style.height = '64px'; wrap.appendChild(s); }
    $('#resState').style.display = 'none';
  }

  function filtered(){
    const q = V.normText(state.q);
    return state.rows.filter(m =>
      (!q || V.normText(m.player_a).includes(q) || V.normText(m.player_b).includes(q) || V.normText(m.group_label).includes(q)) &&
      (!state.cat || String(m.edition_category_id) === state.cat) &&
      (!state.grp || m.group_label === state.grp) &&
      (!state.status || m.status === state.status)
    );
  }

  function render(){
    const rows = filtered();
    $('#resCount').textContent = state.rows.length;
    $('#resMeta').textContent = (state.loadedAt ? 'Actualizado ' + state.loadedAt.toLocaleTimeString('es-MX') + ' · ' : '') +
      rows.length + ' resultado' + (rows.length === 1 ? '' : 's');
    const wrap = $('#resList');
    wrap.setAttribute('aria-busy', 'false');
    wrap.textContent = '';
    if (!rows.length){
      showState(
        state.rows.length ? 'Sin resultados con esos filtros' : 'Aún no hay partidos publicados',
        state.rows.length ? 'Ajusta la búsqueda o los filtros.' : 'Los partidos aparecen aquí cuando la organización publica el rol de juegos de la fase de grupos.'
      );
      return;
    }
    $('#resState').style.display = 'none';
    rows.forEach(m => {
      const c = el('div', 'hud match');
      const g = el('div', 'mg', m.group_label || '—');
      g.appendChild(el('small', null, state.catNames[m.edition_category_id] || 'Grupo'));
      c.appendChild(g);
      const a = el('div', 'mp pa' + (m.player_a ? '' : ' tbd') + (m.winner && m.winner === m.player_a ? ' win' : ''));
      const b = el('div', 'mp pb' + (m.player_b ? '' : ' tbd') + (m.winner && m.winner === m.player_b ? ' win' : ''));
      const regA = m.player_a ? regFor(m.group_id, m.player_a) : null;
      const regB = m.player_b ? regFor(m.group_id, m.player_b) : null;
      a.appendChild(regA ? window.SB_LINKS.makePlayerLink(m.player_a, regA) : document.createTextNode(m.player_a || 'Por definir'));
      b.appendChild(regB ? window.SB_LINKS.makePlayerLink(m.player_b, regB) : document.createTextNode(m.player_b || 'Por definir'));
      c.appendChild(a);
      const sc = window.SB_RESULTS.scoreLine(m);
      const vs = el('span', 'vs', sc.main);
      if (sc.sub) vs.appendChild(el('small', null, sc.sub));
      c.appendChild(vs);
      c.appendChild(b);
      const st = m.status === 'SCHEDULED' && !m.winner ? 'SCHEDULED' : m.status;
      c.appendChild(UI.badge(st));
      wrap.appendChild(c);
    });
  }

  async function load(){
    if (!window.SB_READY){
      showState('Sitio no conectado', 'Falta configurar la conexión al servidor. Avisa a la organización.');
      return;
    }
    skeletons();
    try {
      const edition = await window.SB_CATALOG.getActiveEdition();
      const edcats = await window.SB_CATALOG.getEditionCategories(edition.id);
      state.catNames = {}; edcats.forEach(c => { state.catNames[c.id] = c.name || c.code; });
      state.rows = await window.SB_RESULTS.fetchMatches(edcats.map(c => c.id));
      state.regByNick = {};
      try {
        const members = await window.SB_GROUPS.fetchMembers(edcats.map(c => c.id));
        members.forEach(m => { if (m.registration_id) state.regByNick[m.group_id + '|' + V.normText(m.nickname)] = m.registration_id; });
      } catch(e){ /* enlaces de perfil opcionales; la tabla sigue funcionando sin ellos */ }
      state.loadedAt = new Date();
      const catSel = $('#resCat'), grpSel = $('#resGroup');
      catSel.length = 1;
      edcats.filter(c => state.rows.some(m => m.edition_category_id === c.id)).forEach(c => {
        const o = document.createElement('option'); o.value = String(c.id); o.textContent = c.name || c.code; catSel.appendChild(o);
      });
      grpSel.length = 1;
      [...new Set(state.rows.map(m => m.group_label).filter(Boolean))].sort().forEach(gl => {
        const o = document.createElement('option'); o.value = gl; o.textContent = 'Grupo ' + gl; grpSel.appendChild(o);
      });
      render();
    } catch(err){
      window.SB_LOG && window.SB_LOG.error('RES-001', err);
      $('#resList').textContent = '';
      showState('No se pudieron cargar los partidos', 'Intenta de nuevo en unos minutos. (código RES-001)', true);
    }
  }

  $('#resSearch').addEventListener('input', e => { state.q = e.target.value; render(); });
  $('#resCat').addEventListener('change', e => { state.cat = e.target.value; render(); });
  $('#resGroup').addEventListener('change', e => { state.grp = e.target.value; render(); });
  $('#resStatus').addEventListener('change', e => { state.status = e.target.value; render(); });
  $('#resClear').addEventListener('click', () => {
    state.q = state.cat = state.grp = state.status = '';
    $('#resSearch').value = ''; $('#resCat').value = ''; $('#resGroup').value = ''; $('#resStatus').value = '';
    render();
  });
  $('#resReload').addEventListener('click', load);
  load();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(()=>{});
})();
</script>
</body>
</html>
