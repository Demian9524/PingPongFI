<a class="skip-link" href="#contenido">Saltar al contenido</a>

<nav class="top fi-nav" data-fi-nav data-active="directorio" aria-label="Principal"></nav>

<main class="wrap dirx-wrap" id="contenido">
  <section class="dx-hero" aria-label="Buscador general" data-screen-label="Buscador general">
    <div class="dx-hl">
      <div class="dx-giant" aria-hidden="true">DIRECTORIO</div>
      <div class="dx-head">
        <div class="dx-kicker" id="dxKicker">Torneo de Ping Pong FI</div>
        <h1>Directorio <span class="dx-em">general</span></h1>
        <p class="dx-lede">Un solo buscador para todo el torneo: jugadores, facultades y categorías. Escribe lo que busques o explora por bloques.</p>
      </div>
      <div class="dx-searchwrap">
        <div class="dx-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
          <input type="search" id="dxQ" placeholder="Apodo, facultad, carrera, categoría o grupo…" autocomplete="off" aria-label="Buscar en el directorio" />
          <button type="button" class="dx-x" id="dxX" aria-label="Limpiar búsqueda" hidden>×</button>
        </div>
        <div class="dx-tries" id="dxTries" hidden></div>
      </div>
      <div class="dx-scopes" id="dxScopes" role="tablist" aria-label="Qué buscar"></div>
      <div class="dx-metarow">
        <span class="dx-meta" id="dxMeta" aria-live="polite"></span>
        <button type="button" class="dx-btn" id="dxReload">Actualizar</button>
      </div>
    </div>
    <aside class="dx-hr" aria-label="Resumen del directorio">
      <div class="dx-stat"><b id="dxNPlayers">—</b><span>Jugadores</span></div>
      <div class="dx-stat"><b id="dxNFacs">—</b><span>Facultades</span></div>
      <div class="dx-stat"><b id="dxNCats">—</b><span>Categorías</span></div>
    </aside>
  </section>

  <nav class="dx-edsel" id="dxEdSel" aria-label="Elegir edición" hidden></nav>

  <div class="state" id="dxState" aria-live="polite"><span class="spin" aria-hidden="true">◌</span> Cargando directorio…</div>
  <div id="dxResults"></div>
</main>
