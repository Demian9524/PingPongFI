<script>
// Partículas de polvo flotando de la esquina inferior izquierda hacia la derecha (estilo loading screen)
(function(){
  var canvas = document.getElementById('pjDust');
  if (!canvas || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, parts = [];
  var N = 150;
  // Capas de profundidad (estilo motas de polvo en un rayo de luz, ref. The
  // Last of Us): lejos = muchas, chicas, lentas, tenues; cerca = pocas,
  // grandes, rápidas, más brillantes. Mezclarlas da la ilusión de profundidad.
  var LAYERS = [
    { w:0.55, r:[0.35,0.9],  vx:[0.06,0.18], vy:[0.02,0.10], a:[0.03,0.10] },
    { w:0.32, r:[0.9,1.9],   vx:[0.15,0.4],  vy:[0.05,0.18], a:[0.08,0.20] },
    { w:0.13, r:[1.7,3.2],   vx:[0.35,0.85], vy:[0.1,0.28],  a:[0.16,0.34] }
  ];
  function pickLayer(){
    var r = Math.random(), acc = 0;
    for (var i = 0; i < LAYERS.length; i++){ acc += LAYERS[i].w; if (r <= acc) return LAYERS[i]; }
    return LAYERS[LAYERS.length - 1];
  }
  function rnd(range){ return range[0] + Math.random() * (range[1] - range[0]); }
  function resize(){
    var r = canvas.parentElement.getBoundingClientRect();
    W = canvas.width = Math.max(1, Math.round(r.width));
    H = canvas.height = Math.max(1, Math.round(r.height));
  }
  function spawn(p, initial){
    var L = p.layer || (p.layer = pickLayer());
    p.x = initial ? Math.random() * W : -10 - Math.random() * 40;
    p.y = initial ? Math.random() * H : H * (0.55 + Math.random() * 0.5);
    p.r = rnd(L.r);
    p.vx = rnd(L.vx);          // hacia la derecha, según su capa de profundidad
    p.vy = -rnd(L.vy);         // subiendo suave, según su capa
    p.a = rnd(L.a);
    p.ph = Math.random() * Math.PI * 2;          // fase para parpadeo/ondulación
    p.sp = 0.0008 + Math.random() * 0.002;
    p.gph = Math.random() * Math.PI * 2;         // fase propia de la ráfaga de velocidad
    p.gsp = 0.00015 + Math.random() * 0.00025;
    return p;
  }
  function tick(t){
    if (W < 2 || H < 2){ resize(); if (W > 2 && parts.length) parts.forEach(function(p){ spawn(p, true); }); requestAnimationFrame(tick); return; }
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++){
      var p = parts[i];
      p.ph += p.sp * 16;
      p.gph += p.gsp * 16;
      // ráfaga: a veces más rápido, a veces más lento — nunca constante
      var gust = 0.55 + 0.55 * (0.5 + 0.5 * Math.sin(p.gph));
      p.x += p.vx * gust;
      p.y += p.vy * gust + Math.sin(p.ph) * (0.06 + p.r * 0.05);
      if (p.x > W + 12 || p.y < -12) spawn(p, false);
      var tw = 0.7 + 0.3 * Math.sin(p.ph * 1.7);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(243,233,210,' + (p.a * tw).toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  resize();
  for (var i = 0; i < N; i++) parts.push(spawn({}, true));
  addEventListener('resize', resize);
  requestAnimationFrame(tick);
})();
</script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
  // Tweak: legibilidad del botón WhatsApp del perfil
  const WA_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "waFillMult": 2.4,
    "waBorderMult": 1.4,
    "waElev": false,
    "waArrow": false,
    "waPulse": true
  }/*EDITMODE-END*/;
  function WaTweaks(){
    const [t, setTweak] = useTweaks(WA_TWEAK_DEFAULTS);
    React.useEffect(() => {
      document.documentElement.style.setProperty('--tw-fill-mult', t.waFillMult);
      document.documentElement.style.setProperty('--tw-border-mult', t.waBorderMult);
    }, [t.waFillMult, t.waBorderMult]);
    React.useEffect(() => {
      if (t.waElev) document.documentElement.style.setProperty('--tw-elev', '0 6px 14px rgba(0,0,0,.55)');
      else document.documentElement.style.removeProperty('--tw-elev');
    }, [t.waElev]);
    React.useEffect(() => { document.body.classList.toggle('tw-arrow-on', t.waArrow); }, [t.waArrow]);
    React.useEffect(() => { document.body.classList.toggle('tw-wa-pulse', t.waPulse); }, [t.waPulse]);
    return (
      <TweaksPanel title="Botón WhatsApp">
        <TweakSection label="Legibilidad" />
        <TweakSlider label="Opacidad de fondo" value={t.waFillMult} min={1} max={2.4} step={0.1} onChange={(v) => setTweak('waFillMult', v)} />
        <TweakSlider label="Brillo de borde" value={t.waBorderMult} min={1} max={1.4} step={0.05} onChange={(v) => setTweak('waBorderMult', v)} />
        <TweakToggle label="Sombra de elevación" value={t.waElev} onChange={(v) => setTweak('waElev', v)} />
        <TweakToggle label="Flecha indicadora" value={t.waArrow} onChange={(v) => setTweak('waArrow', v)} />
        <TweakToggle label="Pulso en reposo" value={t.waPulse} onChange={(v) => setTweak('waPulse', v)} />
      </TweaksPanel>
    );
  }
  const waTweakRoot = document.createElement('div');
  document.body.appendChild(waTweakRoot);
  ReactDOM.createRoot(waTweakRoot).render(<WaTweaks />);
</script>
